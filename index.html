  <script>(function () {
  'use strict';

  const STYLE_ID = 'hybrid-editor-v3-style';
  const num = value => {
    const parsed = Number(String(value ?? '').replace(/\s/g, '').replace(',', '.'));
    return Number.isFinite(parsed) ? parsed : 0;
  };

  function addStyles() {
    if (document.getElementById(STYLE_ID)) return;
    const style = document.createElement('style');
    style.id = STYLE_ID;
    style.textContent = `
      .hybrid-head{display:grid;grid-template-columns:repeat(4,minmax(150px,1fr));gap:12px;margin-bottom:14px}
      .hybrid-clients{position:relative}.hybrid-client-control{display:flex;align-items:center;flex-wrap:wrap;gap:6px;max-width:620px;min-height:42px;padding:4px 8px;border:1px solid var(--line);border-radius:8px;background:#fff}.hybrid-client-control:focus-within{outline:2px solid var(--teal-100);border-color:var(--teal-500)}.hybrid-client-search{flex:1 1 180px;min-width:140px;border:0;outline:0;padding:6px 2px}.hybrid-client-toggle{align-self:stretch;width:30px;border:0;background:transparent;cursor:pointer}.hybrid-client-arrow{display:inline-block;width:8px;height:8px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:translateY(-2px) rotate(45deg);transition:transform .15s}.hybrid-client-toggle[aria-expanded=true] .hybrid-client-arrow{transform:translateY(2px) rotate(225deg)}.hybrid-client-list{position:absolute;z-index:30;left:0;right:0;max-width:620px;max-height:220px;overflow:auto;margin-top:4px;padding:5px;border:1px solid var(--line);border-radius:8px;background:#fff;box-shadow:0 8px 24px rgba(15,23,42,.14)}.hybrid-client-list[hidden],.hybrid-client-bridge{display:none}.hybrid-client-option{display:block;width:100%;padding:9px 10px;border:0;border-radius:6px;background:transparent;text-align:left;cursor:pointer}.hybrid-client-option:hover,.hybrid-client-option.is-active{background:var(--teal-50);color:var(--teal-700)}.hybrid-client-empty{padding:9px 10px;color:var(--muted)}.hybrid-chip{display:inline-flex;align-items:center;gap:5px;padding:4px 7px;border-radius:14px;background:var(--teal-50);color:var(--teal-700);font-size:13px}.hybrid-chip button{border:0;background:transparent;color:inherit;cursor:pointer;font-size:16px;line-height:1}
      .editor-layout.hybrid-wide{display:block}.editor-layout.hybrid-wide .context{position:static;margin-top:18px}.editor-layout.hybrid-wide .context .card{margin-bottom:18px}

    document.head.appendChild(style);
  }

  function field(label, control, cls) {
    const wrap = document.createElement('div');
    wrap.className = `field${cls ? ` ${cls}` : ''}`;
    const lab = document.createElement('label');
    lab.textContent = label;
    wrap.append(lab, control);
    return wrap;
  }

  function input(value, className, type) {
    const el = document.createElement('input');
    el.className = className || 'input';
    el.type = type || 'text';
    el.value = value ?? '';
    return el;
  }

  function select(options, value) {
    const el = document.createElement('select');
    el.className = 'select';
    options.forEach(([key, label]) => {
      const option = document.createElement('option');
      option.value = key;
      option.textContent = label;
      option.selected = key === value;
      el.appendChild(option);
    });
    return el;
  }

  function booleanValue(value) {
    if (typeof value === 'boolean') return value;
    if (typeof value === 'number') return value !== 0;
    const normalized = String(value ?? '').trim().toLocaleLowerCase('ru');
    return ['1', 'true', 'yes', 'on', 'да', 'аннулирован', 'аннулировано'].includes(normalized);
  }

  window.hybridEditor = function hybridEditor(ctx) {
    const { ui, products, clientDirectory, render, esc, money, markDirty, updateEditingFromInputs } = ctx || {};
    if (ui?.clientComboCleanup) { ui.clientComboCleanup(); delete ui.clientComboCleanup; }
    if (!ui || ui.page !== 'editor' || !ui.editing) return;
    const r = ui.editing;
    r.details = r.details && typeof r.details === 'object' ? r.details : {};
    r.lines.forEach(line => { line.params = line.params && typeof line.params === 'object' ? line.params : {}; });
    addStyles();

    const setDetail = (key, value) => { r.details[key] = value; markDirty(); };

    function enhanceProjectCard() {

        el.placeholder = key === 'Комментарий к продлению' ? 'Основание и особые условия' : 'Например, при изменении тарифа более чем на 5%';
        bindValue(el, value => setDetail(key, value), false); extensionBody.appendChild(field(key, el));

      if (r.details['Продление с']) {

        extensionBody.appendChild(legacy);

    function enhanceClients(checks) {
      const parentField = checks.closest('.field');
      if (!parentField) return;
      parentField.classList.add('hybrid-clients');
      checks.className = 'hybrid-client-bridge';

      const control = document.createElement('div'); control.className = 'hybrid-client-control';
      const search = input('', 'input hybrid-client-search', 'search');
      const toggle = document.createElement('button'); toggle.type = 'button'; toggle.className = 'hybrid-client-toggle';
      toggle.setAttribute('aria-label', 'Открыть список клиентов'); toggle.setAttribute('aria-expanded', 'false');
      const arrow = document.createElement('span'); arrow.className = 'hybrid-client-arrow'; arrow.setAttribute('aria-hidden', 'true'); toggle.appendChild(arrow);
      const list = document.createElement('div'); list.className = 'hybrid-client-list'; list.hidden = true;
      const listId = `hybrid-client-list-${String(r.number || 'new').replace(/[^a-z0-9_-]/gi, '-')}`;
      list.id = listId; list.setAttribute('role', 'listbox'); list.setAttribute('aria-multiselectable', 'true');
      search.placeholder = 'Найти и выбрать клиента'; search.setAttribute('aria-label', 'Клиенты');
      search.setAttribute('role', 'combobox'); search.setAttribute('aria-autocomplete', 'list'); search.setAttribute('aria-controls', listId); search.setAttribute('aria-expanded', 'false');
      parentField.insertBefore(control, checks); parentField.appendChild(list);
      let activeIndex = -1;
      const selected = () => Array.isArray(r.clients) ? r.clients : [];
      const commitClients = clients => {
        r.clients = [...new Set(clients)];
        r.tariffs = r.tariffs || {};
        r.clients.forEach(name => { if (!Object.prototype.hasOwnProperty.call(r.tariffs, name)) r.tariffs[name] = clientDirectory[name]?.tariff ?? null; });
        ui.restoreClientComboFocus = true; markDirty(); render();

      const close = () => { list.hidden = true; search.setAttribute('aria-expanded', 'false'); toggle.setAttribute('aria-expanded', 'false'); toggle.setAttribute('aria-label', 'Открыть список клиентов'); search.removeAttribute('aria-activedescendant'); activeIndex = -1; document.removeEventListener('pointerdown', outsidePointer); };
      const open = () => { drawOptions(); list.hidden = false; search.setAttribute('aria-expanded', 'true'); toggle.setAttribute('aria-expanded', 'true'); toggle.setAttribute('aria-label', 'Закрыть список клиентов'); document.addEventListener('pointerdown', outsidePointer); };
      const drawChips = () => {
        control.querySelectorAll('.hybrid-chip').forEach(chip => chip.remove());
        selected().forEach(name => {
          const chip = document.createElement('span'); chip.className = 'hybrid-chip';
          const text = document.createElement('span'); text.textContent = name;
          const remove = document.createElement('button'); remove.type = 'button'; remove.textContent = '×'; remove.setAttribute('aria-label', `Удалить ${name}`);
          remove.addEventListener('click', () => commitClients(selected().filter(client => client !== name)));
          chip.append(text, remove); control.insertBefore(chip, search);
        });
      };
      const available = () => {
        const query = search.value.trim().toLocaleLowerCase('ru');
        return Object.keys(clientDirectory).filter(name => !selected().includes(name) && name.toLocaleLowerCase('ru').includes(query));
      };
      const drawOptions = () => {
        list.replaceChildren(); const names = available();
        if (activeIndex >= names.length) activeIndex = names.length - 1;
        names.forEach((name, index) => {
          const option = document.createElement('button'); option.type = 'button'; option.className = `hybrid-client-option${index === activeIndex ? ' is-active' : ''}`;
          option.id = `${listId}-option-${index}`; option.setAttribute('role', 'option'); option.setAttribute('aria-selected', 'false'); option.textContent = name;

    function enhanceLines() {
      const first = document.querySelector('[data-line-card]');
      const section = first && first.closest('.card');
      const body = section && section.querySelector('.card-body');
      if (!body) return;
      const cards = [...body.querySelectorAll('[data-line-card]')];
      const add = body.querySelector('[data-action="add-line"]');
      const toolbar = document.createElement('div'); toolbar.className = 'hybrid-table-toolbar';
      const economy = document.createElement('button'); economy.type = 'button'; economy.className = 'btn small';
      const showEconomy = Boolean(ui.showLineEconomy);
      economy.textContent = showEconomy ? 'Скрыть экономику' : 'Показать экономику';

      const wrap = document.createElement('div'); wrap.className = 'table-wrap';
      const table = document.createElement('table'); table.className = `data-table hybrid-table${showEconomy ? ' show-economy' : ''}`;
      const columns = [
        ['Позиция', false], ['Вид продукции', false], ['Продукт', false], ['Толщина стекла, мм', false], ['Формат листа, мм (А × Б)', false], ['Площадь, м²', false], ['Базовая цена', false], ['Предложение', false],
        ['Утверждённая цена', true], ['БП', true], ['Тара', true], ['Себестоимость покрытия', true], ['БП транспорт', true], ['Факт транспорт', true], ['База при 0%', true],
        ['Предложение без НДС', false], ['Условная доходность, %', true], ['Наценка авто', true], ['Наценка джамбо', true], ['Вычет самовывоза', true], ['Сравнение цен', true], ['Действия', false]

      thead.appendChild(headRow); table.appendChild(thead);
      const tbody = document.createElement('tbody'); table.appendChild(tbody);
      cards.forEach((card, index) => {
        const line = r.lines[index]; if (!line) return;
        const row = document.createElement('tr'); row.dataset.lineRow = line.id;
        const controls = {
          active: card.querySelector('input[name="activeLine"]'), type: card.querySelector('.line-type'), product: card.querySelector('.line-product'),
          area: card.querySelector('.line-area'), price: card.querySelector('.line-price'), remove: card.querySelector('[data-remove-line]')

        const cells = [

          paramInput(line, 'Размер', line.params['Размер'] || '', 'compact format-input', 'Например, 3210 × 2550'), controls.area,

          paramInput(line, 'БП транспорт, ₽/м²', line.params['БП транспорт, ₽/м²'] || ''), paramInput(line, 'Факт транспорт, ₽/м²', line.params['Факт транспорт, ₽/м²'] || ''),

          paramInput(line, 'Наценка джамбо, ₽/м²', line.params['Наценка джамбо, ₽/м²'] || ''), paramInput(line, 'Вычет самовывоза, ₽/м²', line.params['Вычет самовывоза, ₽/м²'] || ''),

        tbody.appendChild(row); card.remove();
      });

    function thicknessControl(line, product) {

    function paramInput(line, key, value, extraClass, placeholder) {

    function calcSpan(value, note) { const span = document.createElement('span'); span.className = 'calc'; span.textContent = money(value); if (note) { const small = document.createElement('small'); small.className = 'method'; small.textContent = note; span.appendChild(small); } return span; }
    function methodSpan(value, note) { const span = document.createElement('span'); span.className = 'calc'; span.innerHTML = `${esc(value)}<small class="method">${esc(note)}</small>`; return span; }
    function baseFor(product, record) { try { return typeof window.hBase === 'function' ? num(window.hBase(product, record)) : num(product.base); } catch { return num(product.base); } }
    function netOffer(line, record) { try { return num(line.price) / window.hFactor(record); } catch { return NaN; } }

    function enhanceCalculation() {
      const heading = [...document.querySelectorAll('.card h2')].find(el => el.textContent.includes('Расчёт текущего продукта'));
      const card = heading && heading.closest('.card'); if (!card) return;
      const note = document.createElement('div'); note.className = 'notice hybrid-note';
      note.textContent = 'Расчёт учитывает выбранный тип прайса и налогообложение. Прибыльность и база при 0% не вычисляются: методики не заданы.';
      card.querySelector('.card-body')?.appendChild(note);
    }

    function updateComputed() {
      r.lines.forEach(line => {
        const row = document.querySelector(`[data-line-row="${CSS.escape(line.id)}"]`); if (!row) return;

      });
    }
  };
})();

    `;
    document.head.appendChild(style);
  }

  const lower = value => String(value ?? '').trim().toLocaleLowerCase('ru');
  const marketOf = record => record && record.market === 'export' ? 'export' : 'ru';
  const marketLabel = market => market === 'export' ? 'Экспортный' : 'Российский';
  const hiddenDetailKeys = new Set(['Показывать экономику', 'Режимы прайса']);
  const extensionDetailKeys = new Set(['Продление с', 'Продление до', 'Комментарий к продлению']);
  function formatDate(value) {
    if (!value) return '—';
    const parts = String(value).split('-');
    return parts.length === 3 ? `${parts[2]}.${parts[1]}.${parts[0]}` : String(value);
  }

  function option(value, label, selected, esc) {
    return `<option value="${esc(value)}" ${value === selected ? 'selected' : ''}>${esc(label)}</option>`;
  }

  function patchRegistry(ctx) {
    const { ui, state, products, render, esc, displayStatus } = ctx;
    if (ui.page !== 'registry' || ui.tab !== 'agreements') return;
    const heading = [...document.querySelectorAll('.card-head h2')].find(node => node.textContent.trim() === 'Реестр согласований');
    const card = heading && heading.closest('.card');
    if (!card) return;
    const body = card.querySelector('.card-body');
    const toolbar = body && body.querySelector('.toolbar');
    const thead = body && body.querySelector('thead');
    const tbody = body && body.querySelector('tbody');
    if (!toolbar || !thead || !tbody) return;

    const clients = [...new Set(state.records.flatMap(record => record.clients || []))].sort((a, b) => a.localeCompare(b, 'ru'));
    const productNames = [...new Set(state.records.flatMap(record => (record.lines || []).map(line => line.product)))].sort((a, b) => a.localeCompare(b, 'ru'));
    toolbar.className = 'hybrid-filters';
    toolbar.innerHTML = `
      <div class="field"><label for="hybrid-query">Поиск</label><input id="hybrid-query" class="input" value="${esc(registryFilters.query)}" placeholder="Номер, объект, клиент, ассортимент"></div>
      <div class="field"><label for="hybrid-project">Объект</label><input id="hybrid-project" class="input" value="${esc(registryFilters.project)}" placeholder="Например, квартал"></div>
      <div class="field"><label for="hybrid-client">Переработчик / клиент</label><select id="hybrid-client" class="select">${option('', 'Все клиенты', registryFilters.client, esc)}${clients.map(value => option(value, value, registryFilters.client, esc)).join('')}</select></div>
      <div class="field"><label for="hybrid-product">Ассортимент</label><select id="hybrid-product" class="select">${option('', 'Весь ассортимент', registryFilters.product, esc)}${productNames.map(value => option(value, value, registryFilters.product, esc)).join('')}</select></div>
      <div class="field"><label for="hybrid-market">Тип прайса</label><select id="hybrid-market" class="select">${option('all', 'Все типы', registryFilters.market, esc)}${option('ru', 'Российский', registryFilters.market, esc)}${option('export', 'Экспортный', registryFilters.market, esc)}</select></div>
      <div class="field"><label for="status-filter">Статус</label><select id="status-filter" class="select">${['Все статусы', 'Новое', 'На согласовании', 'На доработку', 'Утверждено', 'Архив'].map(value => option(value, value, ui.filter, esc)).join('')}</select></div>
      <label class="switch"><input id="waiting" type="checkbox" ${ui.waiting ? 'checked' : ''}><span>Ожидают решения</span></label>
      <div class="hybrid-filter-actions"><button class="btn" id="hybrid-filter-reset" type="button">Сбросить</button></div>`;

    heading.id = 'registry-heading';
    tbody.closest('table').setAttribute('aria-labelledby', heading.id);
    const advanced = document.createElement('details');
    advanced.className = 'hybrid-filter-disclosure';
    advanced.open = Boolean(ui.showRegistryFilters);
    const activeCount = [registryFilters.project, registryFilters.client, registryFilters.product, registryFilters.market !== 'all'].filter(Boolean).length;
    const summary = document.createElement('summary');
    summary.textContent = activeCount ? `Фильтры · ${activeCount}` : 'Фильтры';
    advanced.append(summary);
    const controls = document.createElement('div');
    controls.className = 'hybrid-filters';
    for (const id of ['hybrid-project','hybrid-client','hybrid-product','hybrid-market']) {
      controls.append(toolbar.querySelector('#' + id).closest('.field'));
    }
    advanced.append(controls);
    toolbar.after(advanced);
    advanced.addEventListener('toggle', () => { ui.showRegistryFilters = advanced.open; });
    const filtered = state.records.filter(record => {
      const status = displayStatus(record);
      const haystack = [record.number, record.project, ...(record.clients || []), ...(record.lines || []).map(line => line.product)].join(' ');
      return (!registryFilters.query || lower(haystack).includes(lower(registryFilters.query)))
        && (!registryFilters.project || lower(record.project).includes(lower(registryFilters.project)))
        && (!registryFilters.client || (record.clients || []).includes(registryFilters.client))
        && (!registryFilters.product || (record.lines || []).some(line => line.product === registryFilters.product))
        && (registryFilters.market === 'all' || marketOf(record) === registryFilters.market)
        && (ui.filter === 'Все статусы' || status === ui.filter)
        && (!ui.waiting || status === 'На согласовании');
    });

    thead.innerHTML = '<tr><th>Номер</th><th>Клиент</th><th>Наш ассортимент</th><th>Проект</th><th>Тип прайса</th><th>Статус</th></tr>';
    tbody.innerHTML = filtered.map(record => `<tr>
      <td><button class="link" data-hybrid-open="${esc(record.number)}">${esc(record.number)}</button><br><small class="muted">ред. ${esc(record.revision || 1)}</small></td>
      <td>${(record.clients || []).map(client => `<button class="link" data-hybrid-client="${esc(client)}">${esc(client)}</button>`).join('<span class="muted"> · </span>')}</td>
      <td>${(record.lines || []).map(line => esc(line.product)).join(', ') || '—'}</td><td>${esc(record.project || '—')}</td>
      <td><span class="tag">${esc(marketLabel(marketOf(record)))}</span></td><td><span class="tag">${esc(displayStatus(record))}</span></td></tr>`).join('') || '<tr><td colspan="6"><div class="empty"><b>Ничего не найдено</b>Измените условия или сбросьте фильтры.</div></td></tr>';
    const extra = card.querySelector('.card-extra');
    if (extra) extra.textContent = `${filtered.length} из ${state.records.length}`;

    const rerender = () => render();
    document.getElementById('hybrid-query').addEventListener('input', event => {
      registryFilters.query = event.target.value;
      const position = event.target.selectionStart;
      rerender();
      const input = document.getElementById('hybrid-query');
      if (input) { input.focus(); input.setSelectionRange(position, position); }
    });
    document.getElementById('hybrid-project').addEventListener('input', event => {
      registryFilters.project = event.target.value;
      const position = event.target.selectionStart;
      rerender();
      const input = document.getElementById('hybrid-project');
      if (input) { input.focus(); input.setSelectionRange(position, position); }
    });
    document.getElementById('hybrid-client').addEventListener('change', event => { registryFilters.client = event.target.value; rerender(); });
    document.getElementById('hybrid-product').addEventListener('change', event => { registryFilters.product = event.target.value; rerender(); });
    document.getElementById('hybrid-market').addEventListener('change', event => { registryFilters.market = event.target.value; rerender(); });
    document.getElementById('status-filter').addEventListener('change', event => { ui.filter = event.target.value; rerender(); });
    document.getElementById('waiting').addEventListener('change', event => { ui.waiting = event.target.checked; rerender(); });
    document.getElementById('hybrid-filter-reset').addEventListener('click', () => {
      registryFilters.query = ''; registryFilters.project = ''; registryFilters.client = ''; registryFilters.product = ''; registryFilters.market = 'all';
      ui.filter = 'Все статусы'; ui.waiting = false; ui.search = '';
      rerender();
    });
    body.querySelectorAll('[data-hybrid-open]').forEach(button => button.addEventListener('click', () => {
      const record = state.records.find(item => item.number === button.dataset.hybridOpen);
      if (!record) return;
      ui.currentNumber = record.number;
      if (displayStatus(record) === 'Новое' && (state.role === 'manager' || state.role === 'demo')) {
        ui.editing = JSON.parse(JSON.stringify(record)); ui.page = 'editor';
      } else ui.page = 'decision';
      render();
    }));
    body.querySelectorAll('[data-hybrid-client]').forEach(button => button.addEventListener('click', () => {
      ui.client = button.dataset.hybridClient; ui.clientTab = 'prices'; ui.page = 'client'; render();
    }));
  }

  function patchPriceList(ctx) {
    const { ui, products, esc, money, render } = ctx;
    if (ui.page !== 'registry' || ui.tab !== 'price-list') return;
    const heading = [...document.querySelectorAll('.card-head h2')].find(node => node.textContent.trim() === 'Архитектурный прайс');
    const card = heading && heading.closest('.card');
    if (!card) return;
    ui.priceMarket = ui.priceMarket === 'export' ? 'export' : 'ru';
    const head = card.querySelector('.card-head');
    const oldExtra = head.querySelector('.tag');
    if (oldExtra) oldExtra.remove();
    head.insertAdjacentHTML('beforeend', `<div class="hybrid-price-switch"><button class="btn small ${ui.priceMarket === 'ru' ? 'active' : ''}" data-price-market="ru">Российский</button><button class="btn small ${ui.priceMarket === 'export' ? 'active' : ''}" data-price-market="export">Экспортный</button></div>`);
    const table = card.querySelector('table');
    if (table) {
      table.querySelector('thead').innerHTML = `<tr><th>Строка прайса</th><th>Категория</th><th>Рынок</th><th>База с НДС, ₽/м²</th><th>База без НДС, ₽/м²</th></tr>`;
      table.querySelector('tbody').innerHTML = Object.entries(products).map(([name, product]) => {
        const withVat = { market: ui.priceMarket, noVat: false };
        const withoutVat = { market: ui.priceMarket, noVat: true };
        return `<tr><td><strong>${esc(name)}</strong></td><td>${esc(product.type || '—')}</td><td>${esc(marketLabel(ui.priceMarket))}</td><td>${money(window.hBase(product, withVat))}</td><td>${money(window.hBase(product, withoutVat))}</td></tr>`;
      }).join('');
    }
    card.querySelectorAll('[data-price-market]').forEach(button => button.addEventListener('click', () => { ui.priceMarket = button.dataset.priceMarket; render(); }));
  }

  function printableValue(value) {
    if (typeof value === 'boolean') return value ? 'Да' : 'Нет';
    if (Array.isArray(value)) return value.map(printableValue).filter(Boolean).join(', ');
    if (value && typeof value === 'object') return Object.entries(value).map(([key, item]) => `${key}: ${printableValue(item)}`).join('; ');
    return value == null ? '' : String(value);
  }

  function visibleEntries(object, omittedKeys = new Set()) {
    const entries = [];
    const seen = new Set();
    Object.entries(object || {}).forEach(([sourceKey, value]) => {
      if (hiddenDetailKeys.has(sourceKey) || omittedKeys.has(sourceKey) || value === '' || value == null) return;
      const key = sourceKey === 'Размер' ? 'Формат листа, мм (А × Б)' : sourceKey === 'Толщина, мм' ? 'Толщина стекла, мм' : sourceKey;
      const fingerprint = `${lower(key)}\u0000${lower(printableValue(value))}`;
      if (seen.has(fingerprint)) return;
      seen.add(fingerprint);
      entries.push([key, value]);
    });
    return entries;
  }

  function entriesHtml(object, esc, omittedKeys) {
    return visibleEntries(object, omittedKeys).map(([key, value]) => `<div class="hybrid-detail"><span>${esc(key)}</span><b>${esc(printableValue(value))}</b></div>`).join('');
  }

  function hasVisibleDetails(object, omittedKeys) {
    return visibleEntries(object, omittedKeys).length > 0;
  }

  function extensionEntries(record) {
    const details = record.details || {};
    const candidates = [
      ['Продление с', details['Продление с']],
      ['Продление до', record.extensionDate || details['Продление до']],
      ['Комментарий к продлению', details['Комментарий к продлению']]
    ];
    return candidates.filter(([, value]) => value !== '' && value != null).map(([key, value]) => [key, key === 'Комментарий к продлению' ? value : formatDate(value)]);
  }

  function dateRange(start, due) {
    return [start, due].filter(Boolean).map(formatDate).join(' — ') || '—';
  }

  function patchDecisionDetails(ctx, record) {
    if (ctx.ui.page !== 'decision' || !record) return;
    const blocks = [];
    if (hasVisibleDetails(record.details, extensionDetailKeys)) blocks.push(`<div><h3>Параметры проекта</h3>${entriesHtml(record.details, ctx.esc, extensionDetailKeys)}</div>`);
    const extensions = extensionEntries(record);
    if (extensions.length) blocks.push(`<div><h3>Продление</h3>${entriesHtml(Object.fromEntries(extensions), ctx.esc)}</div>`);
    (record.lines || []).forEach((line, index) => {
      if (hasVisibleDetails(line.params)) blocks.push(`<div><h3>Позиция ${index + 1} · ${ctx.esc(line.product)}</h3>${entriesHtml(line.params, ctx.esc)}</div>`);
    });
    if (!blocks.length || document.getElementById('hybrid-decision-details')) return;
    const firstCard = document.querySelector('main .card');
    if (firstCard) firstCard.insertAdjacentHTML('afterend', `<details class="card hybrid-details" id="hybrid-decision-details"><summary>Параметры проекта и позиций</summary><div class="hybrid-details-grid">${blocks.join('')}</div></details>`);
  }

  function printDocument(ctx, record) {
    const { products, clientDirectory, esc, money, displayStatus } = ctx;
    const factor = window.hFactor(record);
    const priceLabel = record.noVat ? 'без НДС' : 'с НДС';
    const status = displayStatus(record);
    const sourceApprovalDate = record.details?.['Дата согласования исходного документа'] || '';
    const approvalDate = record.status === 'Утверждено' ? record.approvalDate || '' : '';
    const projectTotal = (record.lines || []).reduce((sum, line) => sum + Number(line.area || 0) * Number(line.price || 0), 0);
    const lineRows = (record.lines || []).map((line, index) => {
      const product = products[line.product] || {};
      const price = Number(line.price);
      const params = entriesHtml(line.params, esc);
      return `<tr><td>${index + 1}</td><td><b>${esc(line.product)}</b>${params ? `<div>${params}</div>` : ''}</td><td class="hybrid-print-num">${money(line.area)}</td><td class="hybrid-print-num">${money(window.hBase(product, record))}</td><td class="hybrid-print-num">${money(price)}</td><td class="hybrid-print-num">${money(Number(line.area) * price)}</td></tr>`;
    }).join('');
    const clientRows = (record.clients || []).map(client => {
      const directory = clientDirectory[client] || {};
      const tariff = record.tariffs && Object.prototype.hasOwnProperty.call(record.tariffs, client) ? record.tariffs[client] : directory.tariff;
      const fca = (record.lines || []).map(line => `${line.product} — ${tariff == null ? '—' : money(Number(line.price) / factor - Number(tariff))}`).join('<br>');
      const tariffPeriod = record.tariffPeriods?.[client] || record.tariffPeriod || directory.tariffMonth || '—';
      return `<tr><td>${esc(client)}</td><td>${esc(directory.delivery || '—')}</td><td>${esc(printableValue(tariffPeriod))}</td><td class="hybrid-print-num">${tariff == null ? '—' : money(tariff)}</td><td class="hybrid-print-num">${fca || '—'}</td></tr>`;
    }).join('');
    const competitors = (record.competitorRows || []).map(row => {
      const own = (record.lines || []).find(line => line.id === row.lineId);
      const source = [row.client, row.sourceNumber].filter(Boolean).join(' / ');
      return `<tr><td>${esc(own?.product || '—')}</td><td>${esc(row.maker || '—')}</td><td>${esc(row.product || '—')}${source ? `<br><small>Источник: ${esc(source)}</small>` : ''}</td><td>${esc(row.thickness || '—')}</td><td class="hybrid-print-num">${money(Number(row.price))}</td></tr>`;
    }).join('');
    const omittedProjectKeys = new Set([...extensionDetailKeys, 'Дата согласования исходного документа']);
    const detailRows = entriesHtml(record.details, esc, omittedProjectKeys);
    const extensions = extensionEntries(record);
    const extensionRows = entriesHtml(Object.fromEntries(extensions), esc);
    const approvalMeta = [
      sourceApprovalDate ? `<div><b>Дата согласования исходного документа</b>${formatDate(sourceApprovalDate)}</div>` : '',
      approvalDate ? `<div><b>Дата утверждения</b>${formatDate(approvalDate)}</div>` : ''
    ].filter(Boolean).join('');
    return `<article class="hybrid-print-sheet" data-print-sheet>
      <p><b>Внутренняя форма</b></p><h1>Согласование проектной цены № ${esc(record.number || '—')}</h1><p>Редакция ${esc(record.revision || 1)}</p>
      <div class="hybrid-print-meta"><div><b>Объект</b>${esc(record.project || '—')}</div><div><b>Срок реализации</b>${dateRange(record.start, record.due)}</div>${approvalMeta}<div><b>Статус</b>${esc(status)}</div><div><b>Тип прайса</b>${esc(marketLabel(marketOf(record)))}</div><div><b>Цены</b>${esc(priceLabel)}</div><div><b>Регион</b>${esc(record.region || '—')}</div></div>
      ${extensionRows ? `<h2>Продление</h2><div class="hybrid-details-grid">${extensionRows}</div>` : ''}
      ${detailRows ? `<h2>Параметры проекта</h2><div class="hybrid-details-grid">${detailRows}</div>` : ''}
      <h2>Все позиции</h2><table data-print-lines><thead><tr><th>№</th><th>Ассортимент и параметры</th><th>Площадь, м²</th><th>База ${esc(priceLabel)}, ₽/м²</th><th>Предложено ${esc(priceLabel)}, ₽/м²</th><th>Сумма ${esc(priceLabel)}, ₽</th></tr></thead><tbody>${lineRows || '<tr><td colspan="6">Позиции не указаны</td></tr>'}</tbody>${lineRows ? `<tfoot><tr><th colspan="5">Итого по всем позициям ${esc(priceLabel)}</th><th class="hybrid-print-num">${money(projectTotal)}</th></tr></tfoot>` : ''}</table>
      <p><b>Основание расчёта:</b> базовый прайс по продукту; сумма позиции = площадь × предложенная цена. FCA = предложение без НДС − тариф.</p>
      <h2>Клиенты, тарифы и FCA</h2><table data-print-clients><thead><tr><th>Переработчик / клиент</th><th>Город / станция</th><th>Период тарифа</th><th>Тариф без НДС, ₽/м²</th><th>FCA по позициям, ₽/м²</th></tr></thead><tbody>${clientRows || '<tr><td colspan="5">Клиенты не указаны</td></tr>'}</tbody></table>
      <h2>Предложения конкурентов</h2><table data-print-competitors><thead><tr><th>Наша позиция</th><th>Конкурент</th><th>Продукт</th><th>Толщина, мм</th><th>Цена ${esc(priceLabel)}, ₽/м²</th></tr></thead><tbody>${competitors || '<tr><td colspan="5">Предложения конкурентов не указаны</td></tr>'}</tbody></table>
      ${record.notes || record.comment || record.returnComment ? `<h2>Комментарии</h2><div class="hybrid-print-notes">${esc(record.notes || record.comment || record.returnComment)}</div>` : ''}
      <div class="hybrid-signatures"><div class="hybrid-signature">Менеджер продаж<small>подпись / ФИО / дата</small></div><div class="hybrid-signature">Руководитель продаж<small>подпись / ФИО / ${approvalDate ? formatDate(approvalDate) : 'дата'}</small></div><div class="hybrid-signature">Ответственный за прайс<small>подпись / ФИО / дата</small></div></div>
      <div class="hybrid-print-foot">Учебные данные. Сформировано для внутреннего согласования.</div></article>`;
  }

  function openPreview(ctx, record) {
    document.querySelector('.hybrid-print-backdrop')?.remove();
    const overlay = document.createElement('div');
    overlay.className = 'hybrid-print-backdrop';
    overlay.innerHTML = `<div class="hybrid-print-dialog" role="dialog" aria-modal="true" aria-labelledby="hybrid-print-title"><div class="hybrid-print-toolbar"><h2 id="hybrid-print-title">Предосмотр печатной формы</h2><button class="btn primary" type="button" data-system-print>Системная печать</button><button class="btn" type="button" data-print-close>Закрыть</button></div>${printDocument(ctx, record)}</div>`;
    document.body.appendChild(overlay);
    const close = () => { document.body.classList.remove('hybrid-printing'); overlay.remove(); };
    overlay.querySelector('[data-print-close]').addEventListener('click', close);
    overlay.addEventListener('click', event => { if (event.target === overlay) close(); });
    overlay.querySelector('[data-system-print]').addEventListener('click', () => {
      document.body.classList.add('hybrid-printing');
      window.addEventListener('afterprint', () => document.body.classList.remove('hybrid-printing'), { once: true });
      window.print();
    });
    const required = ['[data-print-sheet]', '[data-print-lines]', '[data-print-clients]', '[data-print-competitors]'];
    const printIsComplete = required.every(selector => overlay.querySelector(selector)) && overlay.querySelectorAll('[data-print-lines] tbody tr').length === (record.lines || []).length;
    if (!printIsComplete) console.error('Печатная форма собрана не полностью');
  }

  function patchPrintAction(ctx) {
    if (!['editor', 'decision'].includes(ctx.ui.page)) return;
    const record = ctx.ui.page === 'editor' ? ctx.ui.editing : ctx.current();
    if (!record) return;
    const actions = document.querySelector('.page-head .actions');
    if (!actions || actions.querySelector('[data-hybrid-print]')) return;
    const button = document.createElement('button');
    button.className = 'btn'; button.type = 'button'; button.dataset.hybridPrint = ''; button.textContent = 'Печатная форма';
    button.addEventListener('click', () => {
      if (ctx.ui.page === 'editor') ctx.updateEditingFromInputs();
      openPreview(ctx, record);
    });
    actions.prepend(button);
  }

  window.hybridRegistry = function hybridRegistry(context) {
    injectStyles();
    const record = context.ui.page === 'editor' ? context.ui.editing : context.current();
    patchRegistry(context);
    patchPriceList(context);
    patchDecisionDetails(context, record);
    patchPrintAction(context);
  };
})();
</script>

    }
    function validate(r){
      const errors=[];if(!r.project.trim())errors.push('Укажите проект.');if(!['ru','export'].includes(r.market))errors.push('Выберите тип прайса.');if(!r.start)errors.push('Укажите начало срока.');if(!r.due)errors.push('Укажите окончание срока.');if(r.start&&r.due&&r.start>r.due)errors.push('Дата начала не может быть позже даты окончания.');if(r.extensionDate&&r.due&&r.extensionDate<r.due)errors.push('Дата продления не может быть раньше даты окончания.');if(!r.region||r.region==='Регион не указан')errors.push('Укажите регион проекта.');if(!r.clients.length)errors.push('Выберите хотя бы одного клиента.');
      r.lines.forEach((l,i)=>{if(!products[l.product])errors.push(`Позиция ${i+1}: выберите продукт из прайса.`);if(!(Number(l.area)>0))errors.push(`Позиция ${i+1}: площадь должна быть больше нуля.`);if(!(Number(l.price)>0))errors.push(`Позиция ${i+1}: цена должна быть больше нуля.`)});
      r.competitorRows.forEach((c,i)=>{if(!c.product.trim())errors.push(`Конкурент ${i+1}: укажите продукт.`);if(!(Number(c.price)>0))errors.push(`Конкурент ${i+1}: цена должна быть больше нуля.`)});return errors;
    }
    function showErrors(errors){const box=document.getElementById('form-error');if(box)box.innerHTML=errors.length?`<div class="notice warning" style="margin-bottom:16px"><b>Проверьте форму</b><br>${errors.map(esc).join('<br>')}</div>`:'';if(errors.length)window.scrollTo({top:0,behavior:'smooth'})}
    function persistEditing(status){
      updateEditingFromInputs();const errors=validate(ui.editing);if(errors.length){showErrors(errors);return false}
      const r=deepCopy(ui.editing);r.status=status;const idx=state.records.findIndex(x=>x.number===r.number);if(idx>=0)state.records[idx]=r;else state.records.unshift(r);saveState();ui.editing=deepCopy(r);ui.dirty=false;return true;
    }
    function navigate(page){if(ui.dirty&&!confirm('Есть несохранённые изменения. Покинуть форму?'))return;ui.dirty=false;ui.page=page;render()}
    function openRecord(number){ui.currentNumber=number;const r=state.records.find(x=>x.number===number);if(!r)return;if(displayStatus(r)==='Новое'&&canManage()){ui.editing=deepCopy(r);ui.page='editor'}else ui.page='decision';render()}
    function openClient(name){ui.client=name;ui.clientTab='prices';ui.page='client';render()}
    function bind(){
      document.getElementById('role')?.addEventListener('change',e=>{const nextRole=e.target.value,previousRole=state.role;if(ui.page==='editor'&&nextRole==='approver'){if(ui.dirty&&!confirm('При переходе к роли руководителя несохранённые изменения формы будут отменены. Продолжить?')){e.target.value=previousRole;return}ui.dirty=false;ui.editing=null;ui.page=state.records.some(r=>r.number===ui.currentNumber)?'decision':'registry'}state.role=nextRole;saveState();render()});
      document.querySelectorAll('[data-action]').forEach(el=>el.addEventListener('click',()=>handleAction(el.dataset.action)));
      document.querySelectorAll('[data-open]').forEach(el=>el.addEventListener('click',()=>openRecord(el.dataset.open)));
      document.querySelectorAll('[data-client]').forEach(el=>el.addEventListener('click',()=>openClient(el.dataset.client)));
      document.querySelectorAll('[data-tab]').forEach(el=>el.addEventListener('click',()=>{ui.tab=el.dataset.tab;render()}));
      document.querySelectorAll('[data-client-tab]').forEach(el=>el.addEventListener('click',()=>{ui.clientTab=el.dataset.clientTab;render()}));
      document.querySelectorAll('[data-nav]').forEach(el=>el.addEventListener('click',()=>toast('Этот раздел не входит в демонстрацию согласования цен')));
      const search=document.getElementById('search');if(search)search.addEventListener('input',e=>{ui.search=e.target.value;const pos=e.target.selectionStart;render();const n=document.getElementById('search');n.focus();n.setSelectionRange(pos,pos)});
      document.getElementById('status-filter')?.addEventListener('change',e=>{ui.filter=e.target.value;render()});document.getElementById('waiting')?.addEventListener('change',e=>{ui.waiting=e.target.checked;render()});
      document.querySelectorAll('.line-type').forEach(el=>el.addEventListener('change',e=>{updateEditingFromInputs();const line=ui.editing.lines.find(item=>item.id===e.target.dataset.id),firstProduct=Object.keys(products).find(name=>products[name].type===e.target.value);if(line&&firstProduct)line.product=firstProduct;markDirty();render()}));
      document.querySelectorAll('.line-product,.client-check,#region,#market,#no-vat,.comp-maker,.comp-product,.comp-thickness').forEach(el=>el.addEventListener('change',()=>{updateEditingFromInputs();markDirty();render()}));
      document.querySelectorAll('#project,#start,#due,#extension-date,.line-price,.line-area,.comp-price').forEach(el=>el.addEventListener('input',()=>{updateEditingFromInputs();markDirty();updateLiveNumbers()}));
      document.querySelectorAll('input[name="activeLine"]').forEach(el=>el.addEventListener('change',e=>{updateEditingFromInputs();ui.editing.activeLineId=e.target.value;markDirty();render()}));
      document.querySelectorAll('[data-remove-line]').forEach(el=>el.addEventListener('click',()=>{updateEditingFromInputs();const lineId=el.dataset.removeLine;ui.editing.lines=ui.editing.lines.filter(x=>x.id!==lineId);ui.editing.competitorRows=ui.editing.competitorRows.filter(x=>x.lineId!==lineId);if(!ui.editing.lines.some(x=>x.id===ui.editing.activeLineId))ui.editing.activeLineId=ui.editing.lines[0].id;markDirty();render()}));
      document.querySelectorAll('[data-remove-competitor]').forEach(el=>el.addEventListener('click',()=>{updateEditingFromInputs();ui.editing.competitorRows=ui.editing.competitorRows.filter(x=>x.id!==el.dataset.removeCompetitor);markDirty();render()}));
      document.getElementById('compare-client')?.addEventListener('change',e=>{ui.compareClient=e.target.value;render()});
    }
    function handleAction(action){
      if(action==='registry')return navigate('registry');if(action==='clients')return navigate('clients');
      if(action==='reset'){if(confirm('Сбросить все изменения и вернуть исходный сценарий ЦР-0148?')){state=seed();saveState();ui={...ui,page:'registry',tab:'agreements',currentNumber:'ЦР-0148',editing:null,dirty:false,filter:'Все статусы',search:'',waiting:false};render();toast('Демо-данные восстановлены')}return}
      if(action==='create'){if(!canManage())return toast('Создание доступно менеджеру продаж');const max=Math.max(...state.records.map(r=>Number(r.number.replace(/\D/g,''))||0));const id='l'+Date.now();ui.editing={number:`ЦР-${String(max+1).padStart(4,'0')}`,project:'',market:'ru',noVat:false,start:DEMO_DATE,due:'2027-03-31',extensionDate:'',region:'Свердловская область',clients:[],tariffs:{},status:'Новое',revision:1,lines:[{id,product:'Low-E 6 мм',area:1000,price:1195.60}],activeLineId:id,competitorRows:[],history:[]};ui.currentNumber=ui.editing.number;ui.page='editor';ui.dirty=false;render();return}
      if(action==='edit'){if(!canManage())return toast('Редактирование доступно менеджеру продаж');const r=current();ui.editing=deepCopy(r);ui.page='editor';ui.dirty=false;render();return}
      if(action==='add-line'){if(!canManage())return;updateEditingFromInputs();const id='l'+Date.now();ui.editing.lines.push({id,product:'Low-E 6 мм',area:1000,price:1195.60});ui.editing.activeLineId=id;markDirty();render();return}
      if(action==='add-competitor'){if(!canManage())return;updateEditingFromInputs();const line=activeLine(ui.editing),p=products[line.product];ui.editing.competitorRows.push({id:'c'+Date.now(),lineId:line.id,maker:'Larta',product:p.competitor,thickness:p.thickness,price:1230});markDirty();render();return}
      if(action==='save'){if(!canManage())return toast('Сохранение доступно менеджеру продаж');const keepStatus=ui.editing.status==='На доработку'?'На доработку':'Новое';if(persistEditing(keepStatus)){toast('Черновик сохранён локально');ui.page='registry';render()}return}
      if(action==='submit'){if(!canManage())return toast('Отправка доступна менеджеру продаж');updateEditingFromInputs();const wasReturned=ui.editing.status==='На доработку';const errors=validate(ui.editing);if(errors.length){showErrors(errors);return}if(wasReturned){ui.editing.revision=(ui.editing.revision||1)+1;ui.editing.history=ui.editing.history||[];ui.editing.history.unshift({at:nowLabel(),title:'Менеджер отправил исправления',text:`Редакция ${ui.editing.revision}`})}else{ui.editing.history=ui.editing.history||[];ui.editing.history.unshift({at:nowLabel(),title:'Отправлено на согласование',text:`Менеджер продаж · редакция ${ui.editing.revision||1}`})}if(persistEditing('На согласовании')){ui.currentNumber=ui.editing.number;ui.page='decision';render();toast('Отправлено на согласование')}return}
      if(action==='return'){if(!canDecide())return toast('Возврат доступен руководителю продаж');return openReturnModal()}
      if(action==='approve'){if(!canDecide())return toast('Решение доступно руководителю продаж');const r=current();r.status='Утверждено';r.history=r.history||[];r.history.unshift({at:nowLabel(),title:'Цена утверждена',text:`${roleLabel()} · редакция ${r.revision||1}`});saveState();render();toast('Цена утверждена');return}
    }
    function openReturnModal(){
      const modal=document.getElementById('modal');modal.innerHTML=`<div class="modal"><div class="modal-head"><h2 id="modal-title">Вернуть на доработку</h2><button class="btn small ghost" id="modal-close" aria-label="Закрыть">×</button></div><div class="modal-body"><p>Комментарий увидит менеджер рядом с изменениями цены.</p><div class="field"><label for="return-comment">Комментарий *</label><textarea id="return-comment" class="textarea" maxlength="500" placeholder="Например, пересмотрите цену с учётом доставки"></textarea><div id="comment-error" class="error-text"></div></div></div><div class="modal-foot"><button class="btn" id="modal-cancel">Отмена</button><button class="btn primary" id="modal-confirm">Вернуть</button></div></div>`;modal.classList.add('open');const close=()=>modal.classList.remove('open');document.getElementById('modal-close').onclick=close;document.getElementById('modal-cancel').onclick=close;modal.onclick=e=>{if(e.target===modal)close()};document.getElementById('return-comment').focus();document.getElementById('modal-confirm').onclick=()=>{const input=document.getElementById('return-comment'),value=input.value.trim();if(!value){input.classList.add('invalid');document.getElementById('comment-error').textContent='Комментарий обязателен для возврата.';return}const r=current();r.returnSnapshot={revision:r.revision||1,market:r.market,noVat:r.noVat,start:r.start,due:r.due,extensionDate:r.extensionDate||'',lines:deepCopy(r.lines),tariffs:deepCopy(r.tariffs||{}),at:nowLabel()};r.status='На доработку';r.returnComment=value;r.history=r.history||[];r.history.unshift({at:nowLabel(),title:'Возвращено на доработку',text:value});saveState();close();render();toast('Возвращено менеджеру на доработку')};
    }
    window.addEventListener('beforeunload',e=>{if(ui.dirty){e.preventDefault();e.returnValue=''}});
    render();
  })();
  </script>
</body>
</html>
